<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>SELENE // SITE 07 — 月面建设工地与开发中心</title>
<style>
:root{--fg:#e9eef5;--dim:#8a96a8;--line:rgba(180,210,255,.2);--panel:rgba(7,10,15,.62);--acc:#ff7a1f;--cy:#8fd6ff;
  --mono:"Cascadia Mono","JetBrains Mono",Consolas,ui-monospace,monospace;
  --sans:"Segoe UI","PingFang SC","Microsoft YaHei UI","Microsoft YaHei",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;overflow:hidden;color:var(--fg);font-family:var(--sans);-webkit-font-smoothing:antialiased}
canvas#gl{display:block;position:fixed;inset:0;width:100%;height:100%;touch-action:none;outline:none}
#hud{position:fixed;inset:0;pointer-events:none;user-select:none}
#lines{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
#lines polyline{fill:none;stroke:rgba(170,215,255,.55);stroke-width:1}
#lines circle{fill:#cfeaff}
.lab{position:absolute;left:0;top:0;white-space:nowrap;padding:4px 9px 5px;background:rgba(6,9,14,.66);border:1px solid var(--line);will-change:transform}
.lab.r{border-left:2px solid var(--cy)}.lab.l{border-right:2px solid var(--cy)}
.lab b{display:block;font-size:12px;font-weight:600;letter-spacing:.06em;line-height:1.25}
.lab i{display:block;font:10px/1.25 var(--mono);color:var(--dim);letter-spacing:.14em;font-style:normal}
#title{position:absolute;left:28px;top:24px;max-width:46vw}
#title .k{font:11px/1 var(--mono);letter-spacing:.3em;color:var(--dim);display:flex;align-items:center;gap:10px}
#title .k::before{content:"";width:9px;height:9px;background:var(--acc)}
#title h1{margin:11px 0 7px;font-size:25px;font-weight:600;letter-spacing:.09em;line-height:1.2;text-wrap:balance}
#title p{margin:0;font:11px/1.5 var(--mono);letter-spacing:.14em;color:var(--dim)}
#env{position:absolute;right:28px;top:24px;width:248px;background:var(--panel);border:1px solid var(--line);padding:14px 16px 13px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#env .h{display:flex;justify-content:space-between;font:10px/1 var(--mono);letter-spacing:.2em;color:var(--dim)}
#env .h span:last-child{color:#7dffb0}
#env .clock{font:500 29px/1 var(--mono);letter-spacing:.05em;margin:12px 0 4px;font-variant-numeric:tabular-nums}
#env .sub{font:10px/1 var(--mono);letter-spacing:.16em;color:var(--dim);padding-bottom:12px;border-bottom:1px solid var(--line)}
#env dl{margin:11px 0 0;display:grid;grid-template-columns:1fr auto;row-gap:9px;align-items:baseline}
#env dt{font-size:12px;color:#b9c3d1;letter-spacing:.08em}
#env dd{margin:0;font:500 14px/1 var(--mono);font-variant-numeric:tabular-nums;text-align:right}
#env dd small{font-size:10px;color:var(--dim);margin-left:3px}
#env .bar{grid-column:1/3;height:3px;background:rgba(255,255,255,.1);margin-top:-2px}
#env .bar s{display:block;height:100%;width:80%;background:var(--cy);transition:width .8s}
#views{position:absolute;left:28px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:8px;pointer-events:auto}
#views button{all:unset;cursor:pointer;width:104px;padding:10px 12px 10px 14px;background:var(--panel);border:1px solid var(--line);border-left:2px solid transparent;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:background .2s,border-color .2s}
#views button b{display:block;font-size:14px;font-weight:600;letter-spacing:.2em}
#views button i{display:block;font:9px/1 var(--mono);letter-spacing:.18em;color:var(--dim);font-style:normal;margin-top:5px}
#views button:hover{background:rgba(26,34,46,.78)}
#views button:focus-visible{outline:1px solid var(--cy);outline-offset:2px}
#views button.on{border-left-color:var(--acc);background:rgba(30,36,46,.85)}
#hint{position:absolute;left:0;right:0;bottom:18px;text-align:center;font:10px/1 var(--mono);letter-spacing:.22em;color:rgba(160,175,195,.6)}
#load{position:fixed;inset:0;background:#000;display:grid;place-items:center;font:12px/1.8 var(--mono);letter-spacing:.24em;color:var(--dim);text-align:center;transition:opacity .9s;z-index:5}
#load.off{opacity:0;pointer-events:none}
@media (max-width:760px){
  #title{left:16px;top:14px;max-width:58vw}#title h1{font-size:16px;margin:8px 0 4px}#title p{display:none}
  #env{right:12px;top:12px;width:150px;padding:10px}#env .clock{font-size:18px}#env dt{font-size:10px}#env dd{font-size:11px}#env .sub{display:none}
  #views{left:0;right:0;top:auto;bottom:40px;transform:none;flex-direction:row;justify-content:center;gap:6px}
  #views button{width:auto;padding:9px 12px}#views button i{display:none}
  #env dl>*:nth-child(n+9){display:none}
  .lab i{display:none}#hint{bottom:12px}
}
</style>
</head>
<body>
<canvas id="gl" tabindex="0"></canvas>
<div id="hud">
  <svg id="lines"></svg>
  <div id="labels"></div>
  <header id="title">
    <div class="k">SELENE // SITE 07</div>
    <h1>月面建设工地与开发中心</h1>
    <p>LUNAR CONSTRUCTION SITE &amp; DEV CENTER · 89.5°S 沙克尔顿坑缘</p>
  </header>
  <aside id="env">
    <div class="h"><span>环境 / ENV</span><span>● LIVE</span></div>
    <div class="clock" id="e-clock">--:--:--</div>
    <div class="sub" id="e-sub">站点时间 · 月夜 第 9 日</div>
    <dl>
      <dt>舱外温度</dt><dd><span id="e-out">−173.0</span><small>°C</small></dd>
      <dt>舱内温度</dt><dd><span id="e-in">21.5</span><small>°C</small></dd>
      <dt>O₂ 浓度</dt><dd><span id="e-o2">20.9</span><small>%</small></dd>
      <dt>电力负载</dt><dd><span id="e-kw">41.2</span><small>kW</small></dd>

  <nav id="views">
    <button data-v="overview" class="on"><b>全景</b><i>OVERVIEW</i></button>
    <button data-v="entry"><b>入口</b><i>AIRLOCK</i></button>
    <button data-v="print"><b>打印区</b><i>PRINT YARD</i></button>

  <div id="hint">拖拽旋转 · 滚轮缩放 · 右键平移</div>

<div id="load"><div id="load-t">正在装配沙盘 …<br>ASSEMBLING SITE 07</div></div>

<!-- three.js 从 CDN 加载：三路镜像并行探测，谁先通用谁 -->
<script>
(function(){
  var V='0.170.0', CDNS=['https://cdn.jsdelivr.net/npm/three@'+V,'https://unpkg.com/three@'+V,'https://registry.npmmirror.com/three/'+V+'/files','https://fastly.jsdelivr.net/npm/three@'+V];
  var ctrls=[];
  function probe(b,i){return new Promise(function(res,rej){var c=new AbortController();ctrls[i]=c;var t=setTimeout(function(){c.abort();rej()},12000);
    fetch(b+'/build/three.module.js',{signal:c.signal}).then(function(r){clearTimeout(t);r.ok?res(i):rej()}).catch(rej)})}
  // 必须等整页解析完再取 #app 的文本：CDN 探测可能比页面下载先返回，那时只能拿到半截代码
  var ready=new Promise(function(r){document.readyState==='loading'?document.addEventListener('DOMContentLoaded',r):r()});
  Promise.all([Promise.any(CDNS.map(probe)),ready]).then(function(a){var i=a[0];
    ctrls.forEach(function(c,j){if(j!==i)try{c.abort()}catch(e){}});
    var b=CDNS[i];window.__CDN=b;
    var im=document.createElement('script');im.type='importmap';
    im.textContent=JSON.stringify({imports:{'three':b+'/build/three.module.js','three/addons/':b+'/examples/jsm/'}});
    document.head.appendChild(im);
    var s=document.createElement('script');s.type='module';s.textContent=document.getElementById('app').textContent;document.body.appendChild(s);
  }).catch(function(){document.getElementById('load-t').innerHTML='无法加载 three.js<br>请检查网络后刷新'});
  window.addEventListener('error',function(e){var l=document.getElementById('load');if(l&&!l.classList.contains('off'))document.getElementById('load-t').innerHTML='启动出错<br>'+(e.message||'')});
})();
</script>

<script type="text/plain" id="app">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { FontLoader } from 'three/addons/loaders/FontLoader.js';
import { TextGeometry } from 'three/addons/geometries/TextGeometry.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

const PI=Math.PI, TAU=PI*2, rad=d=>d*PI/180;
const V=(x=0,y=0,z=0)=>new THREE.Vector3(x,y,z);
const UP=V(0,1,0);
const PR=2; // 像素比固定 2，不做自动降级
const MSAA=0; // 2 倍像素比已是超采样；独显可改 4 再叠一层 MSAA

/* ───────── 渲染器 / 后期 ───────── */
const canvas=document.getElementById('gl');
const renderer=new THREE.WebGLRenderer({canvas,antialias:false,powerPreference:'high-performance'});
renderer.setPixelRatio(PR);
renderer.setSize(innerWidth,innerHeight,false);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.12;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFShadowMap;
renderer.shadowMap.autoUpdate=false; // 场景近乎静态：阴影图每 0.25s 刷新一次即可

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x000000);

const camera=new THREE.PerspectiveCamera(32,innerWidth/innerHeight,0.08,3000);

const rt=new THREE.WebGLRenderTarget(innerWidth,innerHeight,{type:THREE.HalfFloatType,samples:MSAA});
const composer=new EffectComposer(renderer,rt);
composer.setPixelRatio(PR);
composer.setSize(innerWidth,innerHeight);
composer.addPass(new RenderPass(scene,camera));
// 阈值设在 HDR 2.2：只有被刻意推亮的小灯点才会进 bloom，受光的白色舱体不会
const bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),0.5,0.22,2.2);
composer.addPass(bloom);
const bloomSize=()=>bloom.setSize(innerWidth*PR/2,innerHeight*PR/2); // 辉光本身是模糊的，半分辨率缓冲即可
bloomSize();
composer.addPass(new OutputPass());

/* ───────── 工具 ───────── */
let _s=20261110;
const rnd=()=>{_s=_s+0x6D2B79F5|0;let t=Math.imul(_s^_s>>>15,1|_s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const rr=(a,b)=>a+rnd()*(b-a);
const h2=(x,y)=>{const s=Math.sin(x*127.1+y*311.7)*43758.5453;return s-Math.floor(s)};
const vn=(x,y)=>{const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  return (h2(xi,yi)*(1-u)+h2(xi+1,yi)*u)*(1-v)+(h2(xi,yi+1)*(1-u)+h2(xi+1,yi+1)*u)*v};
const fbm=(x,y)=>vn(x,y)*.5+vn(x*2.1,y*2.1)*.3+vn(x*4.3,y*4.3)*.2;
const sstep=(a,b,x)=>{x=Math.min(1,Math.max(0,(x-a)/(b-a)));return x*x*(3-2*x)};

function canvasTex(w,h,draw,repeat){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');draw(g,w,h);
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;
  if(repeat){t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(repeat[0],repeat[1])}return t}
const M=(color,o={})=>new THREE.MeshStandardMaterial({color,roughness:.7,metalness:0,...o});
const LM=(color,o={})=>new THREE.MeshLambertMaterial({color,...o}); // 哑光大面积材质用 Lambert，省片元
function add(p,geo,mat,x=0,y=0,z=0){const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);p.add(m);return m}
const box=(p,w,h,d,mat,x,y,z)=>add(p,new THREE.BoxGeometry(w,h,d),mat,x,y,z);
const rbox=(p,w,h,d,r,mat,x,y,z)=>add(p,new RoundedBoxGeometry(w,h,d,3,r),mat,x,y,z);
const cyl=(p,rt,rb,h,mat,x,y,z,seg=24,open=false)=>add(p,new THREE.CylinderGeometry(rt,rb,h,seg,1,open),mat,x,y,z);
const sph=(p,r,mat,x,y,z,ws=20,hs=14)=>add(p,new THREE.SphereGeometry(r,ws,hs),mat,x,y,z);
const grp=(p,x=0,y=0,z=0,ry=0)=>{const g=new THREE.Group();g.position.set(x,y,z);g.rotation.y=ry;p.add(g);return g};
function strut(p,a,b,r,mat,seg=8){const d=new THREE.Vector3().subVectors(b,a);const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,d.length(),seg),mat);
  m.position.copy(a).addScaledVector(d,.5);m.quaternion.setFromUnitVectors(UP,d.clone().normalize());p.add(m);return m}
function tube(p,pts,r,mat){return add(p,new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),pts.length*8,r,8),mat)}
// 小灯点：MeshBasic 把颜色推到 HDR，交给 bloom
const lampGeo=new THREE.SphereGeometry(1,10,8), lampMats={};
const lampMat=(color,k)=>lampMats[color+'_'+k]||(lampMats[color+'_'+k]=new THREE.MeshBasicMaterial({color:new THREE.Color(color).multiplyScalar(k)}));
function lamp(p,x,y,z,color=0xbfe0ff,k=6,r=.06){const m=add(p,lampGeo,lampMat(color,k),x,y,z);m.scale.setScalar(r);return m}
const blinkers=[];
function blink(p,x,y,z,color=0xff2414,period=1.6,phase=0,r=.1,duty=.35){const mat=new THREE.MeshBasicMaterial();const m=add(p,lampGeo,mat,x,y,z);m.scale.setScalar(r);
  blinkers.push({mat,base:new THREE.Color(color),period,phase,duty});return m}

/* ───────── 贴图 ───────── */
const regTex=canvasTex(512,512,(g,w,h)=>{g.fillStyle='#9c9c9c';g.fillRect(0,0,w,h);
  for(let i=0;i<22000;i++){const v=rnd();g.fillStyle=v>.5?`rgba(255,255,255,${rr(.03,.16)})`:`rgba(0,0,0,${rr(.04,.22)})`;const s=rr(.6,2.4);g.fillRect(rnd()*w,rnd()*h,s,s)}
  for(let i=0;i<70;i++){const x=rnd()*w,y=rnd()*h,r=rr(2,9);g.fillStyle='rgba(0,0,0,.2)';g.beginPath();g.arc(x,y,r,0,TAU);g.fill();
    g.strokeStyle='rgba(255,255,255,.2)';g.lineWidth=1;g.beginPath();g.arc(x-.6,y-.6,r,0,TAU);g.stroke()}},[5,5]);
const strataTex=canvasTex(1024,256,(g,w,h)=>{
  const bands=[[0,'#8d8f94'],[.07,'#73757a'],[.17,'#5f5c5d'],[.26,'#4c4d52'],[.4,'#6b6660'],[.47,'#414248'],[.63,'#57534f'],[.72,'#303136'],[.9,'#25262a']];
  bands.forEach(([f,c],i)=>{g.fillStyle=c;g.beginPath();g.moveTo(0,h);for(let x=0;x<=w;x+=8){g.lineTo(x,f*h+(i?Math.sin(x*.011+i*1.7)*5+Math.sin(x*.043+i*.6)*2.5:0))}g.lineTo(w,h);g.closePath();g.fill()});
  for(let i=0;i<26000;i++){g.fillStyle=rnd()>.5?`rgba(255,255,255,${rr(.02,.1)})`:`rgba(0,0,0,${rr(.04,.18)})`;g.fillRect(rnd()*w,rnd()*h,rr(1,3),rr(.6,1.6))}
  for(let i=0;i<90;i++){const x=rnd()*w,y=rr(.2,1)*h,r=rr(2,8);g.fillStyle=rnd()>.5?'rgba(150,150,155,.35)':'rgba(20,20,24,.4)';g.beginPath();g.ellipse(x,y,r*rr(1,1.8),r,rr(0,3),0,TAU);g.fill()}
  const gr=g.createLinearGradient(0,0,0,h);gr.addColorStop(0,'rgba(255,255,255,.1)');gr.addColorStop(.1,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(0,0,0,.35)');g.fillStyle=gr;g.fillRect(0,0,w,h)});
function padTex(txt){return canvasTex(512,512,(g)=>{g.fillStyle='#3b3d42';g.fillRect(0,0,512,512);
  for(let i=0;i<5000;i++){g.fillStyle=`rgba(${rnd()>.5?255:0},${rnd()>.5?255:0},${rnd()>.5?255:0},.05)`;g.fillRect(rnd()*512,rnd()*512,2,2)}
  g.strokeStyle='#d6dae0';g.lineWidth=9;g.beginPath();g.arc(256,256,222,0,TAU);g.stroke();
  g.lineWidth=4;g.beginPath();g.arc(256,256,128,0,TAU);g.stroke();
  for(let i=0;i<24;i++){const a=i/24*TAU;g.beginPath();g.moveTo(256+Math.cos(a)*190,256+Math.sin(a)*190);g.lineTo(256+Math.cos(a)*208,256+Math.sin(a)*208);g.stroke()}
  g.strokeStyle='#ff6a14';g.lineWidth=9;for(const a of[0,PI/2,PI,PI*1.5]){g.beginPath();g.arc(256,256,168,a-.22,a+.22);g.stroke()}
  g.fillStyle='#d6dae0';g.font='bold 54px Arial';g.textAlign='center';g.textBaseline='middle';g.fillText(txt,256,256+166)})}
const solarTex=canvasTex(256,128,(g,w,h)=>{g.fillStyle='#0d1b36';g.fillRect(0,0,w,h);g.strokeStyle='rgba(140,180,255,.5)';g.lineWidth=1.5;
  for(let x=0;x<=w;x+=32){g.beginPath();g.moveTo(x,0);g.lineTo(x,h);g.stroke()}for(let y=0;y<=h;y+=32){g.beginPath();g.moveTo(0,y);g.lineTo(w,y);g.stroke()}});
const floorTex=canvasTex(512,512,(g)=>{g.fillStyle='#d9cbb6';g.fillRect(0,0,512,512);g.strokeStyle='rgba(90,70,50,.22)';g.lineWidth=2;
  for(let r=40;r<256;r+=36){g.beginPath();g.arc(256,256,r,0,TAU);g.stroke()}
  for(let i=0;i<24;i++){const a=i/24*TAU;g.beginPath();g.moveTo(256+Math.cos(a)*76,256+Math.sin(a)*76);g.lineTo(256+Math.cos(a)*256,256+Math.sin(a)*256);g.stroke()}
  for(let i=0;i<5000;i++){g.fillStyle=`rgba(60,40,20,${rr(.02,.06)})`;g.fillRect(rnd()*512,rnd()*512,2,2)}});

/* ───────── 材质 ───────── */
const mat={
  hull:M(0xeceef1,{roughness:.5}), hull2:M(0xbcc1c9,{roughness:.6}), panel:M(0x8a9098,{roughness:.6,metalness:.2}),
  dark:M(0x2a2e35,{roughness:.6,metalness:.15}), black:M(0x101114,{roughness:.85}), steel:M(0x9aa1aa,{roughness:.4,metalness:.25}),
  orange:M(0xff6a14,{roughness:.5}), yellow:M(0xf0b20a,{roughness:.55}),
  gold:M(0xdaa63f,{roughness:.34,metalness:.35,flatShading:true,emissive:0x4a3008,emissiveIntensity:.5}),
  glass:new THREE.MeshBasicMaterial({color:0xa9c8ff,transparent:true,opacity:.1,side:THREE.DoubleSide,depthWrite:false,forceSinglePass:true}),
  domeGlass:new THREE.MeshBasicMaterial({color:0xffb878,transparent:true,opacity:.022,side:THREE.DoubleSide,depthWrite:false,forceSinglePass:true}),
  warmWin:M(0x332211,{emissive:0xffb869,emissiveIntensity:1.5,roughness:.3}),
  warmStrip:new THREE.MeshBasicMaterial({color:new THREE.Color(0xffd6a0).multiplyScalar(1.7)}),
  frame:M(0xdfe2e6,{roughness:.45}), concrete:LM(0x7d8086), path:LM(0x35373c),
  print:LM(0xa9a8a4), print2:LM(0x94938f),
  rock:LM(0x6c6e73,{flatShading:true}),
  reg:LM(0xb4b7be,{map:regTex,bumpMap:regTex,bumpScale:.9,vertexColors:true}),
  regDS:LM(0xa8abb2,{map:regTex,bumpMap:regTex,bumpScale:.9,side:THREE.DoubleSide}),
  solar:M(0xffffff,{map:solarTex,roughness:.3,metalness:.2}),
  suit:M(0xf2f2ee,{roughness:.75,emissive:0xffe2c0,emissiveIntensity:.1}), visor:M(0x8a6218,{roughness:.15,metalness:.35,emissive:0x5a3a08,emissiveIntensity:.5}),
  canopy:M(0x0b1522,{roughness:.1,metalness:.3}),
  liner:LM(0xf3e6d2,{side:THREE.BackSide,emissive:0xffc890,emissiveIntensity:.1}),

  for(const L of labels){L.obj.getWorldPosition(_v);const dist=_v.distanceTo(camera.position);_v.project(camera);
    const ok=((L.zone==='in')===inside)&&(W>=760||L.main)&&_v.z<1&&Math.abs(_v.x)<1.02&&Math.abs(_v.y)<1.02&&dist>1.2;
    if(ok){L.sx=(_v.x*.5+.5)*W;L.sy=(-_v.y*.5+.5)*H;L.lx=L.sx+L.side*L.ox;L.ly=L.sy+L.oy;vis.push(L)}
    if(ok!==L.vis){L.vis=ok;const d=ok?'':'none';L.el.style.display=d;L.ln.style.display=d;L.dot.style.display=d}}
  vis.sort((a,b)=>a.ly-b.ly);
  for(let i=1;i<vis.length;i++)for(let j=0;j<i;j++){const a=vis[j],b=vis[i];if(a.side===b.side&&Math.abs(a.lx-b.lx)<150&&Math.abs(b.ly-a.ly)<36)b.ly=a.ly+36}
  for(const L of vis){const ex=L.lx+L.side*10;L.el.style.transform=`translate(${ex.toFixed(1)}px,${L.ly.toFixed(1)}px) translate(${L.side>0?'0':'-100%'},-50%)`;
    L.ln.setAttribute('points',`${L.sx.toFixed(1)},${L.sy.toFixed(1)} ${L.lx.toFixed(1)},${L.ly.toFixed(1)} ${ex.toFixed(1)},${L.ly.toFixed(1)}`);L.dot.setAttribute('cx',L.sx.toFixed(1));L.dot.setAttribute('cy',L.sy.toFixed(1))}}

/* ───────── 镜头 ───────── */
const controls=new OrbitControls(camera,canvas);
controls.enableDamping=true;controls.dampingFactor=.07;controls.maxPolarAngle=PI*.56;controls.minDistance=.8;controls.maxDistance=320;controls.zoomSpeed=.8;
const HOME=V(0,-2.3,0), EL=rad(28);
const fitPts=[],tallPts=[V(-9.5,10.8,-14),V(9.5,10.8,-14),V(-16.6,13.2,-15.6),V(0,8.4,0),V(15.4,6.5,-15.3)];
for(const sx of[-20.6,20.6])for(const sz of[-20.6,20.6])for(const y of[-5.55,0])fitPts.push(V(sx,y,sz));
const tcam=new THREE.PerspectiveCamera();
// 让底座在画面里占 ~78%（取宽高中更紧的一边），高处物体不出框
function fitDist(dir,tgt,fov=camera.fov){tcam.fov=fov;tcam.aspect=camera.aspect;tcam.updateProjectionMatrix();let lo=15,hi=600;
  for(let i=0;i<24;i++){const mid=(lo+hi)/2;tcam.position.copy(tgt).addScaledVector(dir,mid);tcam.lookAt(tgt);tcam.updateMatrixWorld();let m=0;
    for(const p of fitPts){_v.copy(p).project(tcam);m=Math.max(m,Math.abs(_v.x)/.78,Math.abs(_v.y)/.86)}
    for(const p of tallPts){_v.copy(p).project(tcam);m=Math.max(m,Math.abs(_v.x)/.95,Math.abs(_v.y)/.93)}
    if(m>1)lo=mid;else hi=mid}return hi}
const dirOf=a=>V(Math.sin(a)*Math.cos(EL),Math.sin(EL),Math.cos(a)*Math.cos(EL));
const VIEWS={entry:{pos:V(6.6,3.5,27.5),tgt:V(-1.7,1.6,12.2),fov:32},print:{pos:V(20.5,9.2,14.5),tgt:V(12.6,1.8,-1.4),fov:32},inside:{pos:V(3.9,2.95,3.7),tgt:V(0,2.2,-.4),fov:56}};
let mode='overview',userZoom=false,fly=null;
{const d=dirOf(-.52);camera.position.copy(HOME).addScaledVector(d,fitDist(d,HOME,32));controls.target.copy(HOME);controls.autoRotate=true;controls.autoRotateSpeed=.4;controls.update()}
const ease=k=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
function flyTo(pos,tgt,fov,dur,then){fly={p0:camera.position.clone(),t0:controls.target.clone(),f0:camera.fov,p1:pos.clone(),t1:tgt.clone(),f1:fov,t:0,dur,then};controls.enabled=false}
function go(name){mode=name;userZoom=false;controls.autoRotate=false;controls.minDistance=.8;controls.maxDistance=320;
  document.querySelectorAll('#views button').forEach(b=>b.classList.toggle('on',b.dataset.v===name));
  if(name==='overview'){const inside=camera.position.length()<8;const a=inside?-.52:Math.atan2(camera.position.x-controls.target.x,camera.position.z-controls.target.z);const d=dirOf(a);
    flyTo(HOME.clone().addScaledVector(d,fitDist(d,HOME,32)),HOME,32,2.4,()=>{controls.autoRotate=true;controls.autoRotateSpeed=.4})}
  else{const v=VIEWS[name];flyTo(v.pos,v.tgt,v.fov,name==='inside'?3.0:2.4,()=>{if(name==='inside'){controls.maxDistance=5.7;controls.autoRotate=true;controls.autoRotateSpeed=-.3}})}}
document.querySelectorAll('#views button').forEach(b=>b.addEventListener('click',()=>go(b.dataset.v)));
canvas.addEventListener('wheel',()=>{userZoom=true},{passive:true});
const touches=new Set();canvas.addEventListener('pointerdown',e=>{touches.add(e.pointerId);if(touches.size>1||e.button===2)userZoom=true});
addEventListener('pointerup',e=>touches.delete(e.pointerId));addEventListener('pointercancel',e=>touches.delete(e.pointerId));

/* ───────── 环境面板 ───────── */
const $=id=>document.getElementById(id),p2=n=>String(n).padStart(2,'0');
function updateEnv(t){const d=new Date();$('e-clock').textContent=`${p2(d.getHours())}:${p2(d.getMinutes())}:${p2(d.getSeconds())}`;
  $('e-out').textContent='−'+(173+Math.sin(t*.13)*.9+Math.sin(t*.71)*.2).toFixed(1);$('e-in').textContent=(21.5+Math.sin(t*.09)*.3).toFixed(1);
  $('e-o2').textContent=(20.9+Math.sin(t*.3)*.04).toFixed(2);$('e-kw').textContent=(41.2+Math.sin(t*.5)*1.6+Math.sin(t*1.9)*.4).toFixed(1);
  const bat=82+Math.sin(t*.05)*3;$('e-bat').textContent=bat.toFixed(0);$('e-bar').style.width=bat+'%'}

/* ───────── 循环 ───────── */
function resize(){const w=innerWidth,h=innerHeight;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h,false);composer.setSize(w,h);bloomSize()}
addEventListener('resize',resize);
const clock=new THREE.Clock();let t=0,scrAcc=1,envAcc=1,shAcc=1,first=true;const _d=V();
function frame(){requestAnimationFrame(frame);const raw=clock.getDelta(),dt=Math.min(raw,.05);t+=dt;
  // 动画
  trolley.position.x=Math.sin(t*.16)*5.6;
  armYaw.rotation.y=Math.sin(t*.35)*.13;armSh.rotation.z=-(.36+Math.sin(t*.5)*.03);armEl.rotation.z=-(1.24+Math.sin(t*.5+1)*.04);
  arm.userData.wr.rotation.z=-PI-armSh.rotation.z-armEl.rotation.z; // 喷头保持竖直向下
  for(const l of lumps){const k=(l.o+t*.07)%1;l.m.position.x=.15+k*(convL-.3);l.m.visible=k<.97}
  dishYaw.rotation.y=Math.sin(t*.05)*1.2+.6;
  holo.userData.earth.rotation.y=t*.22;holo.position.y=2.6+Math.sin(t*.9)*.04;holoRings[0].rotation.y=t*.5;holoRings[1].rotation.y=-t*.35;
  halo.position.y=5.0+Math.sin(t*.6)*.06;halo2.rotation.y=t*.2;halo2.rotation.x=Math.sin(t*.4)*.12;
  for(const b of blinkers){const on=((t+b.phase*b.period)%b.period)<b.period*b.duty;b.mat.color.copy(b.base).multiplyScalar(on?7:.12)}
  scrAcc+=dt;if(scrAcc>.1){scrAcc=0;for(const s of screens){s.draw(s.g,t);s.tex.needsUpdate=true}}
  shAcc+=dt;if(shAcc>.25){shAcc=0;renderer.shadowMap.needsUpdate=true}
  envAcc+=dt;if(envAcc>.5){envAcc=0;updateEnv(t)}
  // 镜头
  if(fly){fly.t+=Math.min(raw,.25)/fly.dur;const k=ease(Math.min(fly.t,1));camera.position.lerpVectors(fly.p0,fly.p1,k);controls.target.lerpVectors(fly.t0,fly.t1,k);
    camera.fov=fly.f0+(fly.f1-fly.f0)*k;camera.updateProjectionMatrix();camera.lookAt(controls.target);
    if(fly.t>=1){const th=fly.then;fly=null;controls.enabled=true;th&&th()}}
  else{controls.update(dt);
    if(mode==='overview'&&!userZoom){_d.subVectors(camera.position,controls.target).normalize();camera.position.copy(controls.target).addScaledVector(_d,fitDist(_d,controls.target));}}
  camera.updateMatrixWorld();
  composer.render(dt);updateLabels();
  if(first){first=false;document.getElementById('load').classList.add('off')}}
window.__site={go,camera,controls,renderer,scene,composer};
frame();
</script>
